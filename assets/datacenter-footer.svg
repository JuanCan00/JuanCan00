<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Data Center Telemetry Footer">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="fWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .fPacket { stroke-dasharray: 80 1120; animation: fMove 4.5s linear infinite; }
      .fDot { animation: fBlink 2s ease-in-out infinite; }
      @keyframes fMove {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="108" rx="14" fill="url(#fBg)" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Network backbone wave -->
  <path d="M 40 74 C 220 26, 380 96, 600 62 C 820 28, 980 92, 1160 54" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <path d="M 40 74 C 220 26, 380 96, 600 62 C 820 28, 980 92, 1160 54" fill="none" stroke="url(#fWave)" stroke-width="2.4" stroke-linecap="round" class="fPacket" filter="url(#fGlow)"/>

  <!-- Nodes -->
  <circle cx="195" cy="54" r="3.5" fill="#22D3EE" class="fDot"/>
  <circle cx="600" cy="62" r="4" fill="#10B981" class="fDot" filter="url(#fGlow)"/>
  <circle cx="1005" cy="68" r="3.5" fill="#38BDF8" class="fDot"/>

  <!-- Status text -->
  <text x="600" y="36" text-anchor="middle" fill="#E2E8F0" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="2">
    SIGNAL LOCKED // OPEN TO COLLABORATION &amp; CLOUD PROJECTS
  </text>
  <text x="600" y="92" text-anchor="middle" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.4">
    JUAN PABLO CANO · @JUANCAN00 · TELECOMMUNICATIONS ENGINEERING · COLOMBIA
  </text>
</svg>
