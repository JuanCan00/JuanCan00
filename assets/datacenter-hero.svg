<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Juan Pablo Cano - Data Center &amp; Telecommunications Engineering Header">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rackBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#09101E"/>
    </linearGradient>

    <linearGradient id="unitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172540"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="318" rx="16"/>
    </clipPath>

    <style>
      .led-g1 { animation: blinkG 1.9s infinite ease-in-out; }
      .led-g2 { animation: blinkG 2.7s infinite ease-in-out 0.6s; }
      .led-g3 { animation: blinkG 2.2s infinite ease-in-out 1.2s; }
      .led-c1 { animation: blinkC 1.4s infinite ease-in-out 0.2s; }
      .led-c2 { animation: blinkC 1.8s infinite ease-in-out 0.9s; }
      .led-c3 { animation: blinkC 1.2s infinite ease-in-out 0.4s; }
      .led-a1 { animation: blinkA 2.6s infinite ease-in-out 0.3s; }
      .led-a2 { animation: blinkA 3.1s infinite ease-in-out 1.5s; }
      .beacon { animation: pulseBeacon 2s infinite ease-in-out; transform-origin: 432px 62px; }
      .packet-r { stroke-dasharray: 26 220; animation: flowRight 3.2s linear infinite; }
      .packet-r2 { stroke-dasharray: 18 240; animation: flowRight 2.6s linear infinite 1.1s; }
      .packet-l { stroke-dasharray: 26 220; animation: flowLeft 3.4s linear infinite 0.5s; }
      .packet-l2 { stroke-dasharray: 18 240; animation: flowLeft 2.8s linear infinite 1.6s; }
      .scanline { animation: scanY 7s linear infinite; }
      .wave-flow { stroke-dasharray: 14 6; animation: waveShift 2.4s linear infinite; }
      .wave-solid { animation: wavePulse 3.5s ease-in-out infinite; }

      @keyframes blinkG {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.28; }
      }
      @keyframes blinkC {
        0%, 100% { opacity: 0.95; }
        35% { opacity: 0.2; }
        65% { opacity: 1; }
      }
      @keyframes blinkA {
        0%, 70%, 100% { opacity: 0.9; }
        82% { opacity: 0.2; }
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.35); }
      }
      @keyframes flowRight {
        0% { stroke-dashoffset: 246; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowLeft {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 246; }
      }
      @keyframes scanY {
        0% { transform: translateY(-40px); opacity: 0; }
        15% { opacity: 0.22; }
        85% { opacity: 0.22; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      @keyframes waveShift {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes wavePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.45; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="320" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="600" cy="155" rx="440" ry="165" fill="url(#coreGlow)"/>

    <!-- Subtle moving NOC scanline -->
    <rect class="scanline" x="0" y="0" width="1200" height="3" fill="#22D3EE" opacity="0.18"/>

    <!-- ==================== LEFT SERVER RACK (RACK-01) ==================== -->
    <g transform="translate(36, 36)">
      <rect x="0" y="0" width="178" height="248" rx="10" fill="url(#rackBody)" stroke="#1E3A5F" stroke-width="1.5"/>
      <!-- Rack Header -->
      <rect x="10" y="10" width="158" height="22" rx="4" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="25" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1.2">RACK-01 // CORE</text>
      <circle cx="157" cy="21" r="3" fill="#10B981" class="led-g1" filter="url(#glow)"/>

      <!-- Blade 1 -->
      <rect x="10" y="40" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="18" y="48" width="52" height="4" rx="2" fill="#0F172A"/>
      <rect x="18" y="56" width="52" height="4" rx="2" fill="#0F172A"/>
      <rect x="78" y="49" width="24" height="10" rx="2" fill="#081224" stroke="#1E3A5F" stroke-width="0.8"/>
      <circle cx="122" cy="54" r="2.6" fill="#10B981" class="led-g1" filter="url(#glow)"/>
      <circle cx="134" cy="54" r="2.6" fill="#22D3EE" class="led-c1" filter="url(#glow)"/>
      <circle cx="146" cy="54" r="2.6" fill="#22D3EE" class="led-c2" filter="url(#glow)"/>
      <circle cx="158" cy="54" r="2.6" fill="#F59E0B" class="led-a1"/>

      <!-- Blade 2 -->
      <rect x="10" y="75" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="18" y="83" width="52" height="4" rx="2" fill="#0F172A"/>
      <rect x="18" y="91" width="52" height="4" rx="2" fill="#0F172A"/>
      <rect x="78" y="84" width="24" height="10" rx="2" fill="#081224" stroke="#1E3A5F" stroke-width="0.8"/>
      <circle cx="122" cy="89" r="2.6" fill="#10B981" class="led-g2" filter="url(#glow)"/>
      <circle cx="134" cy="89" r="2.6" fill="#10B981" class="led-g3"/>
      <circle cx="146" cy="89" r="2.6" fill="#22D3EE" class="led-c3" filter="url(#glow)"/>
      <circle cx="158" cy="89" r="2.6" fill="#38BDF8" class="led-c1"/>

      <!-- Blade 3 -->
      <rect x="10" y="110" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <rect x="18" y="118" width="52" height="4" rx="2" fill="#0F172A"/>
      <rect x="18" y="126" width="52" height="4" rx="2" fill="#0F172A"/>
      <rect x="78" y="119" width="24" height="10" rx="2" fill="#081224" stroke="#1E3A5F" stroke-width="0.8"/>
      <circle cx="122" cy="124" r="2.6" fill="#22D3EE" class="led-c2" filter="url(#glow)"/>
      <circle cx="134" cy="124" r="2.6" fill="#10B981" class="led-g1" filter="url(#glow)"/>
      <circle cx="146" cy="124" r="2.6" fill="#F59E0B" class="led-a2"/>
      <circle cx="158" cy="124" r="2.6" fill="#22D3EE" class="led-c3" filter="url(#glow)"/>

      <!-- Blade 4 (Switch Ports) -->
      <rect x="10" y="145" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <g fill="#0A162B" stroke="#1E3A5F" stroke-width="0.8">
        <rect x="18" y="153" width="12" height="12" rx="2"/>
        <rect x="34" y="153" width="12" height="12" rx="2"/>
        <rect x="50" y="153" width="12" height="12" rx="2"/>
        <rect x="66" y="153" width="12" height="12" rx="2"/>
        <rect x="82" y="153" width="12" height="12" rx="2"/>
        <rect x="98" y="153" width="12" height="12" rx="2"/>
      </g>
      <circle cx="24" cy="151" r="1.5" fill="#10B981" class="led-g1"/>
      <circle cx="40" cy="151" r="1.5" fill="#22D3EE" class="led-c1"/>
      <circle cx="56" cy="151" r="1.5" fill="#10B981" class="led-g2"/>
      <circle cx="72" cy="151" r="1.5" fill="#22D3EE" class="led-c3"/>
      <circle cx="88" cy="151" r="1.5" fill="#10B981" class="led-g3"/>
      <circle cx="104" cy="151" r="1.5" fill="#F59E0B" class="led-a1"/>
      <text x="120" y="162" fill="#64748B" font-family="Consolas, monospace" font-size="9">10GbE</text>

      <!-- Blade 5 (Telemetry Bars) -->
      <rect x="10" y="180" width="158" height="56" rx="4" fill="#08101F" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="195" fill="#64748B" font-family="Consolas, monospace" font-size="9">TX/RX LOAD</text>
      <text x="125" y="195" fill="#22D3EE" font-family="Consolas, monospace" font-size="9">ACTIVE</text>
      <rect x="18" y="203" width="140" height="6" rx="3" fill="#111C33"/>
      <rect x="18" y="203" width="98" height="6" rx="3" fill="#0EA5E9">
        <animate attributeName="width" values="72;122;88;114;72" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="216" width="140" height="6" rx="3" fill="#111C33"/>
      <rect x="18" y="216" width="84" height="6" rx="3" fill="#10B981">
        <animate attributeName="width" values="92;58;112;76;92" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ==================== RIGHT SERVER RACK (RACK-02) ==================== -->
    <g transform="translate(986, 36)">
      <rect x="0" y="0" width="178" height="248" rx="10" fill="url(#rackBody)" stroke="#1E3A5F" stroke-width="1.5"/>
      <!-- Rack Header -->
      <rect x="10" y="10" width="158" height="22" rx="4" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="25" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1.2">RACK-02 // CLOUD</text>
      <circle cx="157" cy="21" r="3" fill="#22D3EE" class="led-c1" filter="url(#glow)"/>

      <!-- Blade 1 -->
      <rect x="10" y="40" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="22" cy="54" r="2.6" fill="#22D3EE" class="led-c2" filter="url(#glow)"/>
      <circle cx="34" cy="54" r="2.6" fill="#10B981" class="led-g2" filter="url(#glow)"/>
      <circle cx="46" cy="54" r="2.6" fill="#22D3EE" class="led-c1"/>
      <rect x="64" y="48" width="94" height="4" rx="2" fill="#0F172A"/>
      <rect x="64" y="56" width="94" height="4" rx="2" fill="#0F172A"/>

      <!-- Blade 2 -->
      <rect x="10" y="75" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="22" cy="89" r="2.6" fill="#10B981" class="led-g1" filter="url(#glow)"/>
      <circle cx="34" cy="89" r="2.6" fill="#F59E0B" class="led-a1"/>
      <circle cx="46" cy="89" r="2.6" fill="#22D3EE" class="led-c3" filter="url(#glow)"/>
      <rect x="64" y="83" width="94" height="4" rx="2" fill="#0F172A"/>
      <rect x="64" y="91" width="94" height="4" rx="2" fill="#0F172A"/>

      <!-- Blade 3 -->
      <rect x="10" y="110" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="22" cy="124" r="2.6" fill="#22D3EE" class="led-c3" filter="url(#glow)"/>
      <circle cx="34" cy="124" r="2.6" fill="#22D3EE" class="led-c1" filter="url(#glow)"/>
      <circle cx="46" cy="124" r="2.6" fill="#10B981" class="led-g3"/>
      <rect x="64" y="118" width="94" height="4" rx="2" fill="#0F172A"/>
      <rect x="64" y="126" width="94" height="4" rx="2" fill="#0F172A"/>

      <!-- Blade 4 (DSP / Signal Module) -->
      <rect x="10" y="145" width="158" height="28" rx="4" fill="url(#unitGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="22" cy="159" r="2.6" fill="#10B981" class="led-g2" filter="url(#glow)"/>
      <text x="36" y="162" fill="#94A3B8" font-family="Consolas, monospace" font-size="9">DSP // FFT ENGINE</text>
      <circle cx="156" cy="159" r="2.6" fill="#38BDF8" class="led-c2" filter="url(#glow)"/>

      <!-- Blade 5 (Latency & Uptime) -->
      <rect x="10" y="180" width="158" height="56" rx="4" fill="#08101F" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="196" fill="#64748B" font-family="Consolas, monospace" font-size="9">UPTIME</text>
      <text x="112" y="196" fill="#10B981" font-family="Consolas, monospace" font-size="9" font-weight="700">99.98%</text>
      <text x="18" y="212" fill="#64748B" font-family="Consolas, monospace" font-size="9">EDGE</text>
      <text x="90" y="212" fill="#38BDF8" font-family="Consolas, monospace" font-size="9">CLOUDFLARE</text>
      <text x="18" y="227" fill="#64748B" font-family="Consolas, monospace" font-size="9">PROTO</text>
      <text x="94" y="227" fill="#22D3EE" font-family="Consolas, monospace" font-size="9">TCP / IPv6</text>
    </g>

    <!-- ==================== FIBER OPTIC TRACES (LEFT -> CENTER) ==================== -->
    <g fill="none" stroke-linecap="round">
      <!-- Static rails -->
      <path d="M 214 90 H 264 L 292 118 H 345" stroke="#1E3A5F" stroke-width="2"/>
      <path d="M 214 160 H 335" stroke="#1E3A5F" stroke-width="2"/>
      <path d="M 214 225 H 264 L 292 197 H 345" stroke="#1E3A5F" stroke-width="2"/>
      <!-- Animated light packets -->
      <path d="M 214 90 H 264 L 292 118 H 345" stroke="#22D3EE" stroke-width="2.5" class="packet-r" filter="url(#glow)"/>
      <path d="M 214 160 H 335" stroke="#38BDF8" stroke-width="2.5" class="packet-r2" filter="url(#glow)"/>
      <path d="M 214 225 H 264 L 292 197 H 345" stroke="#10B981" stroke-width="2.5" class="packet-r" filter="url(#glow)"/>
      <!-- Junction nodes -->
      <circle cx="214" cy="90" r="3.5" fill="#22D3EE"/>
      <circle cx="214" cy="160" r="3.5" fill="#38BDF8"/>
      <circle cx="214" cy="225" r="3.5" fill="#10B981"/>
    </g>

    <!-- ==================== FIBER OPTIC TRACES (RIGHT -> CENTER) ==================== -->
    <g fill="none" stroke-linecap="round">
      <path d="M 986 90 H 936 L 908 118 H 855" stroke="#1E3A5F" stroke-width="2"/>
      <path d="M 986 160 H 865" stroke="#1E3A5F" stroke-width="2"/>
      <path d="M 986 225 H 936 L 908 197 H 855" stroke="#1E3A5F" stroke-width="2"/>
      <path d="M 986 90 H 936 L 908 118 H 855" stroke="#22D3EE" stroke-width="2.5" class="packet-l" filter="url(#glow)"/>
      <path d="M 986 160 H 865" stroke="#38BDF8" stroke-width="2.5" class="packet-l2" filter="url(#glow)"/>
      <path d="M 986 225 H 936 L 908 197 H 855" stroke="#10B981" stroke-width="2.5" class="packet-l" filter="url(#glow)"/>
      <circle cx="986" cy="90" r="3.5" fill="#22D3EE"/>
      <circle cx="986" cy="160" r="3.5" fill="#38BDF8"/>
      <circle cx="986" cy="225" r="3.5" fill="#10B981"/>
    </g>

    <!-- ==================== CENTER NOC COMMAND PANEL ==================== -->
    <g>
      <rect x="342" y="36" width="516" height="248" rx="14" fill="#080E1C" fill-opacity="0.88" stroke="#1E3A5F" stroke-width="1.5"/>

      <!-- HUD Corners -->
      <path d="M 354 58 V 48 H 366" fill="none" stroke="#22D3EE" stroke-width="2"/>
      <path d="M 846 58 V 48 H 834" fill="none" stroke="#22D3EE" stroke-width="2"/>
      <path d="M 354 262 V 272 H 366" fill="none" stroke="#22D3EE" stroke-width="2"/>
      <path d="M 846 262 V 272 H 834" fill="none" stroke="#22D3EE" stroke-width="2"/>

      <!-- Status Pill -->
      <rect x="418" y="50" width="364" height="24" rx="12" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="432" cy="62" r="4" fill="#10B981" class="beacon" filter="url(#glow)"/>
      <text x="607" y="66" text-anchor="middle" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.4">
        NODE // UMNG · COLOMBIA · <tspan fill="#10B981" font-weight="700">ONLINE</tspan>
      </text>

      <!-- Main Name -->
      <text x="600" y="130" text-anchor="middle" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="2.2">
        JUAN PABLO CANO
      </text>

      <!-- Subtitle -->
      <text x="600" y="161" text-anchor="middle" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="13.5" font-weight="600" letter-spacing="1.8">
        TELECOMMUNICATIONS ENGINEERING · CLOUD &amp; NETWORKS
      </text>

      <!-- Subtle Tagline -->
      <text x="600" y="185" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="13">
        Sistemas · Infraestructura Escalable · Procesamiento de Señales · Desarrollo Web
      </text>

      <!-- Animated RF / Fourier Signal Waveform -->
      <line x1="382" y1="234" x2="818" y2="234" stroke="#1E293B" stroke-width="1"/>
      <path d="M 382 234 Q 404 210 426 234 T 470 234 T 514 234 T 558 234 T 602 234 T 646 234 T 690 234 T 734 234 T 778 234 T 818 234"
            fill="none" stroke="url(#waveGrad)" stroke-width="2.2" class="wave-flow" filter="url(#glow)"/>
      <path d="M 382 234 Q 418 254 454 234 T 526 234 T 598 234 T 670 234 T 742 234 T 818 234"
            fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.55" class="wave-solid"/>

      <!-- Mini Telemetry Labels -->
      <text x="382" y="264" fill="#64748B" font-family="Consolas, monospace" font-size="9.5" letter-spacing="1">SIG // FFT-SPECTRUM</text>
      <text x="600" y="264" text-anchor="middle" fill="#64748B" font-family="Consolas, monospace" font-size="9.5" letter-spacing="1">@JUANCAN00</text>
      <text x="818" y="264" text-anchor="end" fill="#64748B" font-family="Consolas, monospace" font-size="9.5" letter-spacing="1">LINK // 10 Gbps</text>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  </g>
</svg>
