<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="Animated fiber optic divider">
  <defs>
    <linearGradient id="rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="15%" stop-color="#1E3A5F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#1E3A5F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <filter id="pGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulseA { stroke-dasharray: 90 1110; animation: travelA 4.2s linear infinite; }
      .pulseB { stroke-dasharray: 55 1145; animation: travelB 5.6s linear infinite 1.4s; }
      @keyframes travelA {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes travelB {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1200; }
      }
    </style>
  </defs>

  <!-- Base Fiber Line -->
  <line x1="20" y1="14" x2="1180" y2="14" stroke="url(#rail)" stroke-width="1.5"/>

  <!-- Animated Fiber Packets -->
  <line x1="20" y1="14" x2="1180" y2="14" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" class="pulseA" filter="url(#pGlow)"/>
  <line x1="20" y1="14" x2="1180" y2="14" stroke="#10B981" stroke-width="2" stroke-linecap="round" class="pulseB" filter="url(#pGlow)"/>

  <!-- Center & Side Nodes -->
  <circle cx="180" cy="14" r="3" fill="#0B1120" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="594" y="8" width="12" height="12" rx="3" transform="rotate(45 600 14)" fill="#0B1120" stroke="#22D3EE" stroke-width="1.6"/>
  <circle cx="1020" cy="14" r="3" fill="#0B1120" stroke="#38BDF8" stroke-width="1.5"/>
</svg>
